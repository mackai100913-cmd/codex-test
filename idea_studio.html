<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイデア・スタジオ — 情報カード伴走</title>
<style>
  :root{
    /* Atelier Sage tokens — 紙と苔の単一トークン */
    --surface-bg:#F4EFE6; --bg:#F4EFE6; --panel:#FBF7EF; --panel2:#F4EFE6; --line:#D9D2C4;
    --ink:#1F2A24; --txt:#2E3A33; --mut:#5A6B61; --acc:#3F6B4E; --accB:#3F6B4E; --accA:#B5562C;
    --warn:#B5562C; --chip:#EEE6D3; --vio:#3F6B4E; --org:#B5562C; --red:#B5562C;
    --serif:Georgia,'游明朝','Yu Mincho',serif;
    --sans:system-ui,-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
  button:active{transform:translateY(1px)}
  @media(pointer:coarse){button{min-height:40px}}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.65;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
  header{padding:18px 16px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{margin:0;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink);letter-spacing:0}
  .sub{color:var(--mut);font-size:12px;margin-top:3px}
  .northstar{margin-top:9px;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--txt)}
  .northstar b{color:var(--acc)}
  main{padding:14px;max-width:1180px;margin:0 auto}
  .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
  textarea#input{width:100%;min-height:56px;resize:vertical;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:14px;font-family:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;
    border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  button.ghost{background:transparent;color:var(--mut);padding:6px 10px}
  button.sm{padding:5px 9px;font-size:12px}
  select,input.txt{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:9px;
    padding:7px 9px;font-size:13px;font-family:inherit}
  .spacer{flex:1}
  .aibadge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
  .aibadge.on{background:#EAF2EC;color:var(--acc);border-color:var(--acc);font-weight:700}
  /* companion */
  .coach{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
  .coach h3{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
  .obs{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .obs:first-of-type{border-top:none}
  .obs .ic{flex:0 0 auto;font-size:15px}
  .obs b{color:var(--ink)}
  .nextline{margin-top:9px;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;font-size:13px;color:var(--txt);font-family:var(--serif)}
  .nextline b{color:var(--accA)}
  /* distribution */
  .dist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .dist .b{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;color:var(--mut)}
  .dist .b b{color:var(--txt);font-size:15px;margin-right:3px}
  /* board controls */
  .bc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bc .lbl{font-size:12px;color:var(--mut)}
  /* board */
  .board{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:720px){.board{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:60px}
  .col h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
  .col h4 .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:var(--panel2);border-radius:10px;padding:1px 8px}
  .ic-card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .ic-card:hover{border-color:var(--accB);transform:translateY(-1px)}
  .ic-card .txt{font-size:13px;white-space:pre-wrap;word-break:break-word}
  .ic-card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tg{font-size:10px;padding:1px 7px;border-radius:8px;background:var(--chip);color:var(--mut);border:1px solid var(--line)}
  .tg.conf{border:none}
  .empty{color:var(--mut);font-size:12px;text-align:center;padding:14px 0}
  /* 空状態（最初の一手） */
  .firstrun{grid-column:1/-1;text-align:center;padding:44px 20px;background:var(--panel);
    border:1px dashed var(--line);border-radius:16px}
  .fr-emoji{font-size:40px;line-height:1;margin-bottom:14px}
  .fr-title{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:8px}
  .fr-sub{font-size:13px;color:var(--mut);line-height:1.7;margin-bottom:20px}
  .fr-btn{background:var(--acc);color:#fff;border:none;border-radius:10px;
    padding:11px 20px;font-size:14px;font-family:inherit;font-weight:700;cursor:pointer}
  .fr-btn:hover{background:var(--accA)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(31,42,36,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:15px}
  .modal label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  .modal textarea{width:100%;min-height:80px;resize:vertical;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:14px;font-family:inherit}
  .selgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal select{width:100%}
  .mfoot{display:flex;gap:8px;margin-top:16px;align-items:center}
  .hint{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
  .foot{color:var(--mut);font-size:11px;text-align:center;padding:22px 12px}
  a{color:var(--acc);text-underline-offset:3px}
  code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12px}
  /* 共通ナビ（戻る＋プロジェクト名） */
  .topnav{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .topnav .back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;
    color:var(--mut);font-size:13px;padding:6px 10px;border-radius:6px;transition:.15s}
  .topnav .back:hover{background:var(--bg);color:var(--ink)}
  .topnav .pn{flex:1;text-align:center;font-family:var(--serif);font-size:13px;color:var(--mut)}
  .topnav .ttl{font-family:var(--serif);font-size:13px;color:var(--ink);padding:6px 10px}
  @media(pointer:coarse){.topnav .back{min-height:40px}}
  /* ⋯ メニュー（シート） */
  .menupop{position:fixed;inset:0;background:rgba(31,42,36,.42);display:none;
    align-items:flex-end;justify-content:center;padding:16px;z-index:60}
  .menupop.on{display:flex}
  @media(min-width:560px){.menupop{align-items:center}}
  .menupop .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:8px;max-width:340px;width:100%;animation:popIn .18s ease}
  @keyframes popIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .menupop .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;padding:11px 14px;border-radius:8px;font-size:14px;
    color:var(--ink);font-family:inherit;cursor:pointer;transition:.1s}
  .menupop .mi:hover{background:var(--bg)}
  .menupop .mi.danger{color:var(--accA)}
  .menupop .div{height:1px;background:var(--line);margin:4px 8px}
  /* coach 折りたたみ */
  .coach details{margin:0}
  .coach details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    font-family:var(--serif);font-size:14px;color:var(--ink);padding:0}
  .coach details summary::-webkit-details-marker{display:none}
  .coach details summary::before{content:'▸';color:var(--mut);font-size:11px;transition:transform .15s}
  .coach details[open] summary::before{transform:rotate(90deg)}
  .coach details[open] summary{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
</style>
</head>

<main>

<script>
/* ===== 分類タクソノミー ===== */
const TYPES=[
 {k:'idea',label:'💡 アイデア',c:'#3F6B4E'},
 {k:'fact',label:'📊 事実',c:'#5A6B61'},
 {k:'question',label:'❓ 問い',c:'#B5562C'},
 {k:'insight',label:'✨ 気づき',c:'#3F6B4E'},
 {k:'decision',label:'✅ 決定',c:'#B5562C'},
 {k:'task',label:'🛠 タスク',c:'#1F2A24'},
 {k:'risk',label:'⚠️ リスク',c:'#B5562C'},
];
const THEMES=['見える化・測定','積立・投資','継続・習慣化','パーソナライズ','コミュニティ',
 '製品形態・UX','信頼・エビデンス','課金・販売','市場・データ','法規・品質','ターゲット・動機','その他'];
const TARGETS=[{k:'A',label:'🅰 女性'},{k:'B',label:'🅱 男性'},{k:'共通',label:'🤝 共通'}];
const STAGES=[{k:'発散',label:'🌱 発散'},{k:'収束',label:'🎯 収束'},{k:'検証',label:'🔬 検証'},{k:'実行',label:'🚀 実行'}];

const TYPE_RULES=[
 ['question',[/[?？]/],['なぜ','どうやって','べきか','だろうか','どうする','可能か','どこまで','いくらで']],
 ['decision',[],['確定','決定','に決め','採用','却下','見送','方針','ゴー','GO']],
 ['risk',[],['リスク','懸念','問題','危険','注意','薬機','景表','違反','難しい','ボトルネック','課題']],
 ['task',[/^\s*[-\[]/],['発注','選定','制作','設計する','調べる','リサーチ','作成','試作','決める','連絡','手配','見積','検証する','洗い出','まとめる']],
 ['fact',[/[0-9０-９]+\s*(%|％|円|億|万|件|人|倍|位|社)/],['市場','調査','データ','出典','統計','シェア','成長率','売上','によると','報告']],
 ['insight',[],['発見','気づき','示唆','つまり','要は','本質','根は','だから','逆に']],
];
const THEME_KW={
 '見える化・測定':['測定','検査','可視化','スコア','数値','見える','グラフ','ダッシュボード','体組成','血圧','骨密度','握力','記録','ログ','カルテ','診断結果'],
 '積立・投資':['積立','貯筋','貯金','複利','満期','通帳','資産','将来','つみたて','節約','口座'],
 '継続・習慣化':['習慣','継続','毎日','毎朝','ストリーク','ルーティン','飲み忘れ','リマインド','続け','カレンダー','定着'],
 'パーソナライズ':['個別','最適化','出し分け','専用','処方','パーソナ','あなた','タイプ判定','体質'],
 'コミュニティ':['コミュニティ','SNS','ランキング','仲間','シェア','家族','ペア','夫婦','卒業生','口コミ','アンバサダー'],
 '製品形態・UX':['剤型','錠剤','粉末','ゼリー','グミ','ドリンク','スープ','おにぎり','バー','容器','パッケージ','味','スティック','カプセル','形態','ヨーグルト'],
 '信頼・エビデンス':['エビデンス','論文','GMP','第三者','医師','監修','透明','根拠','臨床','安全','信頼'],
 '課金・販売':['価格','課金','サブスク','定期','LTV','CPA','販売','法人','返金','メンバーシップ','割引','ポイント','単価','獲得','アップセル','チャネル'],
 '市場・データ':['市場','規模','成長','シェア','競合','億円','トレンド','需要','カテゴリ'],
 '法規・品質':['薬機','景表','機能性表示','届出','原料','原価','品質','表示','規制','関与成分','SR'],
 'ターゲット・動機':['年代','ターゲット','動機','ペルソナ','20代','30代','40代','50代','シニア','悩み','インサイト','なぜ買う','見た目','モテ','清潔感'],
};
const TARGET_KW={
 'A':['女性','エクオール','更年期','大豆','イソフラボン','骨','肌','閉経','ホルモン','コラーゲン','セラミド','美容','糖化'],
 'B':['男性','ブラックジンジャー','筋','筋トレ','プロテイン','脂肪','EAA','HMB','サルコペニア','ジム','体脂肪','クレアチン'],
};
const STAGE_KW={
 '実行':['発注','制作','量産','ローンチ','実装','リリース','手配','着手'],
 '検証':['検査','試作','テスト','モニター','実証','検証','PoC','評価','効果測定'],
 '収束':['絞り','比較','選定','優先','決める','確定','決定','どれにする','採用','却下'],
};

/* ===== 分類エンジン（ローカル） ===== */
function hits(text,arr){return arr.filter(k=>text.includes(k))}
function classifyLocal(text){
  const t=text;
  // type
  let best={k:'idea',sc:0,kw:[]};
  for(const [k,res,kws] of TYPE_RULES){
    let sc=0,kw=[];
    res.forEach(r=>{if(r.test(t)){sc+=2;}});
    const h=hits(t,kws); sc+=h.length; kw=h;
    if(sc>best.sc) best={k,sc,kw};
  }
  const type=best.k;
  // theme
  let th='その他',thSc=0,thKw=[];
  for(const name in THEME_KW){const h=hits(t,THEME_KW[name]);if(h.length>thSc){th=name;thSc=h.length;thKw=h;}}
  // target
  const ha=hits(t,TARGET_KW.A),hb=hits(t,TARGET_KW.B);
  let target='共通';
  if(ha.length&&!hb.length)target='A'; else if(hb.length&&!ha.length)target='B';
  else if(ha.length&&hb.length)target='共通';
  // stage
  let stage=null,stKw=[];
  for(const s in STAGE_KW){const h=hits(t,STAGE_KW[s]);if(h.length){stage=s;stKw=h;break;}}
  if(!stage){ stage=(type==='task')?'実行':(type==='decision')?'収束':(type==='fact'||type==='insight')?'検証':'発散'; }
  // confidence
  const totalHits=best.sc+thSc+(ha.length+hb.length)+stKw.length;
  const conf= totalHits>=5?'高':totalHits>=2?'中':'低';
  const reason=[...new Set([...best.kw,...thKw,...stKw])].slice(0,4).join('・')||'手がかり少なめ（推定）';
  return {type,theme:th,target,stage,conf,reason};
}

/* ===== 分類エンジン（Claude API） ===== */
async function classifyClaude(text){
  const key=settings.key, model=settings.model||'claude-haiku-4-5-20251001';
  if(!key) throw new Error('no key');
  const sys=`あなたは新規事業のアイデア整理を伴走するアシスタントです。入力された情報カード1枚を分類し、JSONのみを返します。`+
   `\ntype は次から1つ: ${TYPES.map(x=>x.k).join(', ')}（idea=アイデア, fact=事実/データ, question=問い, insight=気づき/示唆, decision=決定, task=タスク, risk=リスク/懸念）`+
   `\ntheme は次から1つ: ${THEMES.join(' / ')}`+
   `\ntarget は A(女性/エクオール/更年期/肌), B(男性/ブラックジンジャー/筋/脂肪), 共通 のいずれか`+
   `\nstage は 発散 / 収束 / 検証 / 実行 のいずれか`+
   `\nreason は分類根拠を15字以内の日本語で。`+
   `\n出力は {"type","theme","target","stage","reason"} のJSONのみ。`;
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:200,system:sys,messages:[{role:'user',content:`カード: ${text}`}]})
  });
  if(!res.ok){throw new Error('API '+res.status)}
  const data=await res.json();
  let txt=(data.content||[]).map(b=>b.text||'').join('');
  const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('parse');
  const o=JSON.parse(m[0]);
  if(!TYPES.find(x=>x.k===o.type)) o.type='idea';
  if(!THEMES.includes(o.theme)) o.theme='その他';
  if(!['A','B','共通'].includes(o.target)) o.target='共通';
  if(!['発散','収束','検証','実行'].includes(o.stage)) o.stage='発散';
  o.conf='AI'; o.reason=(o.reason||'AI分類').slice(0,20);
  return o;
}
async function classify(text){
  if(settings.mode==='claude'&&settings.key){
    try{return await classifyClaude(text);}catch(e){
      const r=classifyLocal(text); r.reason='⚠APIエラー→ローカル: '+r.reason; return r;
    }
  }
  return classifyLocal(text);
}

/* ===== 伴走パネル ===== */
function buildCoach(){
  const el=document.getElementById('coach');
  if(!cards.length){ el.innerHTML=''; return; }
  const byType={}; TYPES.forEach(t=>byType[t.k]=0);
  const byTheme={}; THEMES.forEach(t=>byTheme[t]=0);
  const byTgt={A:0,B:0,'共通':0}, byStage={発散:0,収束:0,検証:0,実行:0};
  cards.forEach(c=>{byType[c.type]++;byTheme[c.theme]++;byTgt[c.target]++;byStage[c.stage]++});
  const obs=[];
  // 発散 vs 収束/検証/実行
  const diverge=byStage.発散, converge=byStage.収束+byStage.検証+byStage.実行;
  if(diverge>0||converge>0){
    if(diverge>converge*2&&diverge>=3)
      obs.push(['⚖️',`いまは<b>発散フェーズ</b>（発散${diverge} / 収束以降${converge}）。アイデアは出ています。そろそろ<b>絞り込み・検証</b>に重心を移す頃合いです。`]);
    else if(converge>diverge&&converge>=3)
      obs.push(['⚖️',`<b>収束・実行</b>に寄っています（発散${diverge} / 収束以降${converge}）。煮詰まったら<b>発散</b>を1ラウンド入れて選択肢を広げると吉。`]);
    else
      obs.push(['⚖️',`発散${diverge} / 収束${byStage.収束} / 検証${byStage.検証} / 実行${byStage.実行} — バランス良好。`]);
  }
  // 未解決の問い
  const qs=cards.filter(c=>c.type==='question');
  if(qs.length) obs.push(['❓',`<b>未解決の問いが${qs.length}件</b>。例：「${esc(qs[0].text.slice(0,28))}${qs[0].text.length>28?'…':''}」 — 答えを別カードで返すと前に進みます。`]);
  // リスク
  const rs=cards.filter(c=>c.type==='risk');
  if(rs.length) obs.push(['⚠️',`<b>リスク／課題が${rs.length}件</b>。早めに対処カード（タスク）に変換を。`]);
  // 盲点テーマ（中核8分類で0件のもの）
  const core=THEMES.slice(0,8);
  const blanks=core.filter(t=>byTheme[t]===0);
  if(blanks.length&&cards.length>=4)
    obs.push(['🔭',`盲点かも：<b>${blanks.slice(0,3).join('・')}</b> のカードがまだ0件。この観点でも1枚書いてみると抜けが埋まります。`]);
  // A/B 偏り
  obs.push(['🎯',`対象バランス → 🅰女性 <b>${byTgt.A}</b> / 🅱男性 <b>${byTgt.B}</b> / 共通 <b>${byTgt['共通']}</b>。`+
    (byTgt.A===0?' 女性側の検討が手薄。':byTgt.B===0?' 男性側の検討が手薄。':'')]);
  // next action
  let next='';
  if(qs.length) next=`未解決の問い「${esc(qs[0].text.slice(0,24))}…」にカードで答える`;
  else if(diverge>converge*2&&diverge>=3) next='出たアイデアを「収束（比較・選定）」して本命を2〜3枚に絞る';
  else if(blanks.length) next=`盲点テーマ「${blanks[0]}」のカードを足す`;
  else if(rs.length) next='リスクカードを対処タスクに変換する';
  else next='手応えのあるカードを深掘り（処方・剤型・コピーまで具体化）する';

  const nextPlain=esc(next.replace(/<[^>]+>/g,'')).slice(0,50);
  el.innerHTML=`<details>
    <summary>👉 ${nextPlain}</summary>
    ${obs.slice(0,3).map(o=>`<div class="obs"><span class="ic">${o[0]}</span><div>${o[1]}</div></div>`).join('')}
    <div class="nextline">👉 次の一手：<b>${next}</b></div>
  </details>`;
}

/* ===== ボード ===== */
function render(){
  buildCoach(); buildDist();
  // 空状態：最初の一手を1つだけ提示（Apple流：迷わせない）
  const board0=document.getElementById('board');
  if(!cards.length){
    document.getElementById('total').textContent='';
    board0.innerHTML=`<div class="firstrun">
      <div class="fr-emoji">📝</div>
      <div class="fr-title">最初のカードを書いてみましょう</div>
      <div class="fr-sub">上の欄に思いついたことを1つ書いて <b>Enter</b>。<br>事実・アイデア・問い、なんでもOK。AIが自動で仕分けます。</div>
      <button class="fr-btn" id="frImport">📥 リサーチ成果20枚を入れて試す</button>
    </div>`;
    const fi=document.getElementById('frImport');
    if(fi) fi.onclick=()=>document.getElementById('sampleBtn').click();
    return;
  }
  const gb=document.getElementById('groupBy').value;
  const q=document.getElementById('search').value.trim();
  let groups,keyOf,labelOf,colorOf=()=>'var(--acc)';
  if(gb==='type'){groups=TYPES.map(x=>x.k);keyOf=c=>c.type;labelOf=k=>TYPES.find(x=>x.k===k).label;colorOf=k=>TYPES.find(x=>x.k===k).c;}
  else if(gb==='theme'){groups=THEMES.slice();keyOf=c=>c.theme;labelOf=k=>k;}
  else if(gb==='target'){groups=TARGETS.map(x=>x.k);keyOf=c=>c.target;labelOf=k=>TARGETS.find(x=>x.k===k).label;}
  else{groups=STAGES.map(x=>x.k);keyOf=c=>c.stage;labelOf=k=>STAGES.find(x=>x.k===k).label;}
  const vis=cards.filter(c=>!q||c.text.includes(q)||c.theme.includes(q)||(c.reason||'').includes(q));
  document.getElementById('total').textContent=`${vis.length} / ${cards.length} 枚`;
  const board=document.getElementById('board'); board.innerHTML='';
  groups.forEach(g=>{
    const items=vis.filter(c=>keyOf(c)===g);
    if(!items.length && (gb==='theme')) return; // テーマは空列を省略
    const col=document.createElement('div'); col.className='col';
    const tcolor=(gb==='type')?colorOf(g):'var(--accB)';
    col.innerHTML=`<h4 style="color:${tcolor}">${labelOf(g)}<span class="cnt">${items.length}</span></h4>`;
    if(!items.length){col.innerHTML+=`<div class="empty">—</div>`;}
    items.forEach(c=>{
      const tc=TYPES.find(x=>x.k===c.type)||TYPES[0];
      const card=document.createElement('div'); card.className='ic-card'; card.style.borderLeftColor=tc.c;
      const tgt=TARGETS.find(x=>x.k===c.target)||TARGETS[2];
      const stg=STAGES.find(x=>x.k===c.stage)||STAGES[0];
      card.innerHTML=`<div class="txt">${esc(c.text)}</div><div class="tags">
        ${gb!=='type'?`<span class="tg" style="color:${tc.c}">${tc.label}</span>`:''}
        ${gb!=='theme'?`<span class="tg">📂${esc(c.theme||'')}</span>`:''}
        ${gb!=='target'?`<span class="tg">${tgt.label}</span>`:''}
        ${gb!=='stage'?`<span class="tg">${stg.label}</span>`:''}
        <span class="tg conf" style="color:${c.conf==='AI'?'var(--accB)':c.conf==='高'?'var(--acc)':c.conf==='中'?'var(--warn)':'var(--mut)'}">${c.conf==='AI'?'🤖AI':'確度'+c.conf}</span>
      </div>`;
      card.onclick=()=>openEdit(c.id);
      col.appendChild(card);
    });
    board.appendChild(col);
  });
  if(!vis.length){board.innerHTML=`<div class="col"><div class="empty">該当カードなし</div></div>`;}
}

const VALID_TYPES=new Set(TYPES.map(t=>t.k));
function normalizeCard(c){
  if(!c||typeof c.text!=='string'||!c.text.trim())return null;
  return {id:c.id||uid(), text:c.text,
    type:VALID_TYPES.has(c.type)?c.type:'idea',
    theme:THEMES.includes(c.theme)?c.theme:'その他',
    target:['A','B','共通'].includes(c.target)?c.target:'共通',
    stage:['発散','収束','検証','実行'].includes(c.stage)?c.stage:'発散',
    conf:c.conf||'中', reason:c.reason||'', createdAt:c.createdAt||Date.now()};
}

  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result);
    if(Array.isArray(d.cards)){const ok=d.cards.map(normalizeCard).filter(Boolean);
      if(!ok.length){alert('有効なカードがありませんでした');return;}
      cards=ok.concat(cards);save();render();}
    else alert('カード配列が見つかりませんでした');}catch(err){alert('読み込めませんでした')}};
  r.readAsText(f); e.target.value='';
};

document.getElementById('sampleBtn').onclick=()=>{
  const exist=new Set(cards.map(c=>c.text));
  let n=0;
  for(const r of RESEARCH){
    if(exist.has(r.text))continue;
    const c=normalizeCard(Object.assign({},r));
    if(c){cards.push(c);n++;}
  }
  save();render();
  alert(n?('リサーチカードを'+n+'枚取り込みました'):'すでに全て取り込み済みです');
};
document.getElementById('clearBtn').onclick=()=>{if(confirm('すべてのカードを消去しますか？（取り消せません）')){cards=[];save();render()}};

/* ===== イベント ===== */
document.getElementById('addBtn').onclick=async()=>{const v=input.value;input.value='';await addCard(v)};
document.getElementById('bulkBtn').onclick=async()=>{const v=input.value;input.value='';await addBulk(v)};
document.getElementById('input').addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=input.value;input.value='';await addCard(v)}
});
document.getElementById('groupBy').onchange=render;
document.getElementById('search').oninput=render;
document.getElementById('setBtn').onclick=openSet;

/* ===== ⋯メニュー ===== */
(function(){
  const pop=document.getElementById('menuPop');
  document.getElementById('moreBtn').onclick=()=>pop.classList.add('on');
  pop.addEventListener('click',e=>{
    if(e.target.id==='menuPop'){pop.classList.remove('on');return;}
    if(e.target.closest('.mi'))pop.classList.remove('on');
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')pop.classList.remove('on');
  });
})();
