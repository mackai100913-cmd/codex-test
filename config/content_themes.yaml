# =============================================================
# コンテンツの"ネタの型"（buzz_meshi系グルメで伸びやすい切り口）
# content_planner がここから日替わりでテーマを選び、
# copywriter / image_generator に渡す。
# =============================================================

# 切り口（フック）の型 ── タイトルに使う
angles:
  - id: "cospa"
    label: "コスパ最強"
    hook_templates:
      - "この価格で出していい量じゃない{dish}"
      - "ワンコインでこの満足度はずるい{dish}"
      - "知らないと損するコスパ怪獣{dish}"
  - id: "dekamori"
    label: "デカ盛り"
    hook_templates:
      - "顔より大きい{dish}が爆誕"
      - "完食したら勝ち。規格外{dish}"
      - "胃袋の限界に挑む{dish}"
  - id: "gentei"
    label: "限定・希少"
    hook_templates:
      - "1日{n}食限定の幻の{dish}"
      - "並んででも食べたい限定{dish}"
      - "知る人ぞ知る予約必須の{dish}"
  - id: "shime"
    label: "深夜飯・締め"
    hook_templates:
      - "深夜2時に後悔と幸福の{dish}"
      - "飲んだ後はこれ一択。締めの{dish}"
      - "夜中に見ちゃダメな{dish}"
  - id: "bae"
    label: "映え・断面"
    hook_templates:
      - "断面で優勝する{dish}"
      - "チーズが伸びすぎる{dish}"
      - "湯気まで美味しい{dish}"
  - id: "kakure"
    label: "隠れた名店"
    hook_templates:
      - "地元民しか知らない{dish}"
      - "看板ないのに行列の{dish}"
      - "路地裏の神{dish}"

