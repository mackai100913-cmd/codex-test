  - "せせりとアスパラのレモン炒め"
  - "鶏むね肉のやみつき油淋鶏"
  - "豚バラと白菜のミルフィーユ鍋"
  - "厚揚げの甘辛ガリバタ炒め"
  - "鮭ときのこのバター醤油ホイル焼き"
  - "なすと豚こまのスタミナ味噌炒め"
  - "とろとろチーズのオムライス"
  - "無限ピーマンのツナ和え"
  - "鶏もも肉のはちみつ照り焼き"
  - "豚キムチうどん"
  - "ささみの梅しそ春巻き"
  - "じゃがいもとベーコンのガレット"
  - "牛こまと玉ねぎの甘辛丼"
  - "エビとブロッコリーのガーリックマヨ"
  - "手羽元のさっぱり酢煮"

# フォールバック用の完全レシピ（APIキー無しでも高品質に動作確認できる）
sample_recipes:
  - title_top: "せせりとアスパラの"
    title_main: "レモン炒め"
    intro: "ぷりっと弾けるせせりの旨みと、シャキッとアスパラの食感に、爽やかなレモンが香る、やみつき確定の一皿。"
    intro_highlight: "やみつき確定"
    description: "ガーリックの香ばしさとレモンの酸味が絶妙に絡み合う、さっぱりなのにコク深い味わい。お酒にもごはんにもぴったり！"
    servings: "2人前"
    time: "約20分"
    cost: "約500円"
    difficulty: 2
    difficulty_label: "やさしい"
    ingredients:
      - { name: "せせり（鶏首肉）", amount: "250g" }
      - { name: "アスパラガス", amount: "1束（約100g）" }
      - { name: "レモン", amount: "1/2個" }
      - { name: "にんにく（薄切り）", amount: "1かけ" }
      - { name: "塩", amount: "小さじ1/4" }
      - { name: "黒こしょう", amount: "少々" }
      - { name: "オリーブ油", amount: "大さじ1" }
      - { name: "酒", amount: "大さじ1" }
      - { name: "鶏ガラスープの素", amount: "小さじ1/2" }
      - { name: "しょうゆ", amount: "小さじ1" }
      - { name: "バター", amount: "10g" }
      - { name: "レモン汁", amount: "大さじ1" }
    steps:
      - { title: "下ごしらえ", detail: "せせりは筋を取り食べやすい大きさに切る。アスパラは根元を切り落とし4〜5cm長さに、レモンは薄い輪切りにする。" }
      - { title: "焼く", detail: "フライパンにオリーブ油を中火で熱し、せせりを炒める。焼き色がついたら塩・こしょうをふる。" }
      - { title: "アスパラを加える", detail: "アスパラを加えてさっと炒め、にんにくを加えて香りが立つまで炒める。" }
      - { title: "調味する", detail: "酒を加えてアルコールを飛ばし、鶏ガラスープの素・しょうゆ・レモン汁・レモンの輪切りを加えて炒め合わせる。" }
      - { title: "仕上げ", detail: "火を弱めてバターを加え全体に絡める。黒こしょうをたっぷりふる。" }
      - { title: "盛り付ける", detail: "器に盛り付け、お好みでパセリを散らして完成！" }
    points:
      - { headline: "せせりは焼きすぎない", detail: "ぷりっとジューシーな食感を残すのがコツ！" }
      - { headline: "アスパラは強火でサッと", detail: "シャキッと食感が残って美味しさUP！" }
      - { headline: "レモンは最後に加える", detail: "加熱しすぎると酸味が飛ぶので注意◎" }
      - { headline: "バターは火を止める直前に", detail: "コクと香りが一気に引き立つ！" }
    extra_tip: "仕上げにレモンの皮（すりおろし）を少量加えると、香りがより爽やかに！"
