# =============================================================
# グルメTikTokアカウントのペルソナ／ブランド設定
# ロールモデル: @buzz_meshi（バズ飯系グルメアカウント）
# 目標: フォロワー20万人
# =============================================================

account:
  name: "バズ飯ハンター"          # ← 自分のアカウント名に書き換え可
  handle: "@your_gourmet_account" # ← 自分のハンドルに書き換え可
  goal_followers: 200000
  language: "ja"

# ブランドの世界観（画像・文言の一貫性のために使用）
brand:
  tone: "親しみやすく勢いがある。情報量が多く保存したくなる。"
  catchphrase: "知らなきゃ損する飯、毎日更新。"
  # ロールモデルから抽出した"型"
  signature_style:
    - "冒頭1秒で結論（最強の一皿）を見せる"
    - "大きく太い白文字＋黒フチで可読性最優先"
    - "店名・エリア・価格・特徴を必ず明記"
    - "シズル感（湯気・照り・断面・伸びるチーズ）を強調"
    - "最後に『保存して後で行く』導線"

# 配色・デザイン（画像生成と文字焼き込みで使用）
design:
  primary_color: "#FF3B30"     # 食欲を刺激する赤
  accent_color: "#FFD60A"      # 黄色アクセント
  text_color: "#FFFFFF"
  text_stroke_color: "#000000"
  font_mood: "極太ゴシック・インパクト重視"

# 投稿フォーマット（画像カルーセル中心）
format:
  type: "photo_carousel"
  slides_per_post: 5           # 表紙1 + 料理3 + 情報1
  aspect_ratio: "9:16"         # TikTok縦型
  resolution: "1080x1920"

# ハッシュタグ戦略（広め＋ニッチの組み合わせ）
hashtags:
  always:                      # 毎回つける土台
    - "#グルメ"
    - "#飯テロ"
    - "#tiktokグルメ"
    - "#食べ物"
  rotating_broad:              # 広いリーチ用（毎回ランダムに数個）
    - "#おすすめグルメ"
    - "#美味しいもの好きと繋がりたい"
    - "#デカ盛り"
    - "#コスパグルメ"
    - "#映えグルメ"
    - "#食べ歩き"
  count: 8                     # 1投稿あたりのタグ数

# 投稿スケジュール（伸びやすい時間帯／JST）
schedule:
  best_times_jst:
    - "07:30"   # 通勤・朝の隙間
    - "12:00"   # 昼休み（飯テロが刺さる）
    - "19:00"   # 夕食前
    - "21:30"   # 夜のゴールデンタイム
  posts_per_day: 2
