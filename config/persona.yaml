# =============================================================
# グルメ（レシピ）TikTokアカウントのペルソナ／ブランド設定
# ロールモデル: @buzz_meshi 等のバズるレシピ系グルメ（例: うま飯Lab）
# 目標: フォロワー20万人
# 投稿形式: 画像カルーセル（1枚目=表紙 / 2枚目=レシピカード）＋ 本文に全文レシピ
# =============================================================

account:
  name: "うま飯Lab"               # ← 自分のアカウント名に書き換え可
  handle: "@your_gourmet_account" # ← 自分のハンドルに書き換え可
  goal_followers: 200000
  language: "ja"

brand:
  tone: "高級感のある暗背景＋シズル感。料理家の丁寧な語り口で、煽りは1投稿1回まで。"
  catchphrase: "ラクなのに、ごちそうに見える。"
  concept: "お店みたいを、家のフライパンで。暗くて旨い本格家庭料理で今日の夜ごはんを格上げする。"
  target: "28〜42歳・共働き／毎晩の献立に悩み、手抜きに見えるのは嫌な層"
  # ロールモデルから抽出した"勝ちパターン"
  signature_style:
    - "表紙は暗背景の本格的な料理写真＋金色サブタイトル＋白い大きな料理名(明朝)"
    - "導入文の決めワード(例: やみつき確定)を赤で強調"
    - "2枚目に材料・調理時間・費用・難易度・手順を1枚で凝縮"
    - "本文(キャプション)に材料と手順を全文掲載して保存を促す"
    - "AIっぽさを消し、本物の家庭料理に見えるリアルな写真にする"

# 決めワードのローテーション（陳腐化防止・将来 recipe_generator が参照する拡張ポイント）
copy:
  highlight_words:
    - "やみつき確定"
    - "沼確定"
    - "ごちそう確定"
    - "お店超え"
    - "無限に進む"
  highlight_per_post: 1

# コンテンツの柱（将来 content_planner が企画配分に参照する拡張ポイント）
content_pillars:
  - id: main_dish      # 今夜の主役おかず
    weight: 0.5
    series_tag: "#今夜の格上げおかず"
  - id: side_otsumami  # 15分の副菜・おつまみ
    weight: 0.2
    series_tag: "#15分のごちそう"
  - id: weekend_treat  # 週末ご褒美
    weight: 0.15
    series_tag: "#週末ご褒美キッチン"
  - id: technique      # コツ・テクニック
    weight: 0.1
    series_tag: "#黒皿の法則"
  - id: behind         # 中の人・世界観
    weight: 0.05
    series_tag: "#今月のベスト夜ごはん"

# 配色・デザイン（画像生成と文字焼き込みで使用）
design:
  bg_color: "#0D0D0D"          # 暗い背景
  title_gold: "#E8B84B"        # サブタイトルの金色
  title_white: "#FFFFFF"       # メイン料理名
  highlight_red: "#E23A2E"     # 決めワードの赤
  accent_line: "#E8B84B"       # 区切り線・枠の金
  body_text: "#EDEDED"
  card_panel: "#141414"        # レシピカードのパネル色

# 投稿フォーマット（画像カルーセル中心）
format:
  type: "recipe_carousel"
  aspect_ratio: "9:16"
  resolution: "1080x1920"
  step_count: 6                # 手順の数（01〜06）

# ハッシュタグ戦略（レシピ系で伸びる定番＋動的）
hashtags:
  always:
    - "#夜ごはん"
    - "#簡単レシピ"
    - "#簡単料理"
    - "#時短レシピ"
    - "#節約料理"
  rotating_broad:
    - "#おうちごはん"
    - "#今日のごはん"
    - "#料理好きな人と繋がりたい"
    - "#飯テロ"
    - "#おつまみ"
    - "#献立"
  count: 8

# 品質基準（各責任者の審査・全員がこの点以上で合格）
quality:
  pass_score: 72        # 各責任者100点満点中、この点以上で合格（全責任者がand条件のため上げ過ぎると再生成が増える）
  kpi:
    save_rate_target: 0.03   # 保存率の目標（慣れたら0.05）
    primary_metric: "save_rate"

# 投稿スケジュール（伸びやすい時間帯／JST）
schedule:
  best_times_jst:
    - "07:30"
    - "12:00"
    - "17:30"   # 夕飯の献立を探す時間
    - "21:00"
  posts_per_day: 2
