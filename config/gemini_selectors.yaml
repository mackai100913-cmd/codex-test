# =============================================================
# Geminiウェブ版(gemini.google.com)を自動操作するためのセレクタ設定。
# GeminiのUI変更でうまく動かなくなったら、ブラウザの「検証(F12)」で
# 要素を調べ、ここのセレクタを書き換えてください（コード変更不要）。
# 複数候補を上から順に試します。
# =============================================================

# プロンプト入力欄（contenteditable のリッチテキスト）
input_box:
  - 'div.ql-editor[contenteditable="true"]'
  - 'rich-textarea div[contenteditable="true"]'
  - 'div[contenteditable="true"][role="textbox"]'
  - 'textarea'

# 送信ボタン
send_button:
  - 'button[aria-label="送信"]'
  - 'button[aria-label="Send message"]'
  - 'button[aria-label*="送信"]'
  - 'button[aria-label*="Send"]'
  - 'button.send-button'

# 新しいチャットを始めるボタン（任意・無ければスキップ）
new_chat_button:
  - 'button[aria-label="新しいチャット"]'
  - 'button[aria-label="New chat"]'
  - 'a[aria-label*="新しいチャット"]'

# 応答内に生成された画像
response_image:
  - 'message-content img'
  - 'model-response img'
  - 'div.response-container img'
  - 'img[src^="https://"]'
  - 'img[src^="data:image"]'
  - 'img[src^="blob:"]'

# ログイン済みかの判定に使う要素（これが見えたらログイン済みとみなす）
logged_in_marker:
  - 'div.ql-editor[contenteditable="true"]'
  - 'rich-textarea'
